# Workers 部署用这个文件；Pages 部署不用它（Pages 走 dist-pages/_worker.js，绑定和变量在 Dashboard 配，见 README「部署 B」）。
# 改成你自己的 Worker 名称
name = "sub-merge"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true

# 口令/端口令都放 Cloudflare 后台当明文变量（Dashboard → Settings → Variables and Secrets），
# 这里不加 [vars]，避免把真值写进仓库（本仓库是公开的）。
# keep_vars 让 wrangler deploy 不会清掉后台手填的变量。
keep_vars = true

# 想绑定自己的域名时取消注释并改成你的域名（该 zone 必须已接入 Cloudflare）：
# routes = [
#   { pattern = "sub.example.com", custom_domain = true }
# ]

# D1 数据库绑定：变量名必须是 DB
# 运行 `wrangler d1 create sub-merge-db` 后，把输出的 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "sub-merge-db"
database_id = "7c22a3f0-dd5b-4e2e-99dc-4cd658e47246"

# 口令都放后台变量，不要写进代码或 D1：
#   pnpm exec wrangler secret put TOKEN            # 订阅/上报用的 token
#   pnpm exec wrangler secret put ADMIN_PASSWORD   # WebUI 管理员登录口令
#   pnpm exec wrangler secret put UI_TOKEN         # 可选：另一个管理员口令

# 建表（二选一）：
#   pnpm run db:init          # wrangler d1 execute --remote --file=scripts/schema.sql
#   curl -X POST -H "Authorization: Bearer $TOKEN" https://<worker>/api/v1/admin/schema
